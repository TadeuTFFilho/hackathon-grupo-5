<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-4 border border-warm-100 rounded-[14px] bg-warm-50 relative group">

  <button type="button" onclick="this.closest('.grid').remove()"
          class="absolute top-3 right-3 w-7 h-7 rounded-full text-warm-300 hover:text-red-400 hover:bg-red-50
                 flex items-center justify-center transition-all duration-150 opacity-0 group-hover:opacity-100">
    <i data-lucide="x" class="w-4 h-4"></i>
  </button>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1.5">Credor <span class="text-teal-500">*</span></label>
    <input type="text" name="creditor" placeholder="Ex: Nubank" required
           class="input" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1.5">Tipo <span class="text-teal-500">*</span></label>
    <div class="relative">
      <select name="type" class="input appearance-none pr-8">
        <option value="cartao_credito">Cartão de crédito</option>
        <option value="aluguel">Aluguel</option>
        <option value="servicos_essenciais">Luz / Água / Gás</option>
        <option value="financiamento_garantia">Financiamento (carro / imóvel)</option>
        <option value="emprestimo_bancario">Empréstimo bancário</option>
        <option value="pensao_alimenticia">Pensão alimentícia</option>
        <option value="loja_comercio">Loja / Comércio</option>
        <option value="outros">Outros</option>
      </select>
      <span class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-gray-400">
        <i data-lucide="chevron-down" class="w-4 h-4"></i>
      </span>
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1.5">Valor total <span class="text-teal-500">*</span></label>
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm font-medium pointer-events-none">R$</span>
      <input type="number" name="total_amount" placeholder="0,00" required min="0" step="0.01"
             class="input pl-10" />
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1.5">Parcela mensal</label>
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm font-medium pointer-events-none">R$</span>
      <input type="number" name="monthly_payment" placeholder="0,00" min="0" step="0.01"
             class="input pl-10" />
    </div>
  </div>

  <div class="sm:col-span-2">
    <label class="block text-sm font-medium text-gray-700 mb-1.5">Data de vencimento original</label>
    <input type="date" name="due_date"
           class="input sm:w-48" />
  </div>

</div>
