<div class="grid grid-cols-2 gap-3 mb-4 p-4 border border-gray-100 rounded-xl">
  <div>
    <label class="block text-sm text-gray-600 mb-1">Credor *</label>
    <input type="text" name="creditor" placeholder="Ex: Nubank" required
           class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
  </div>
  <div>
    <label class="block text-sm text-gray-600 mb-1">Tipo *</label>
    <select name="type"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
      <option value="cartao_credito">Cartão de Crédito</option>
      <option value="aluguel">Aluguel</option>
      <option value="servicos_essenciais">Luz / Água / Gás</option>
      <option value="financiamento_garantia">Financiamento (carro/imóvel)</option>
      <option value="emprestimo_bancario">Empréstimo Bancário</option>
      <option value="pensao_alimenticia">Pensão Alimentícia</option>
      <option value="loja_comercio">Loja / Comércio</option>
      <option value="outros">Outros</option>
    </select>
  </div>
  <div>
    <label class="block text-sm text-gray-600 mb-1">Valor total (R$) *</label>
    <input type="number" name="total_amount" placeholder="5000" required min="0" step="0.01"
           class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
  </div>
  <div>
    <label class="block text-sm text-gray-600 mb-1">Parcela mensal (R$)</label>
    <input type="number" name="monthly_payment" placeholder="300" min="0" step="0.01"
           class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
  </div>
  <div class="col-span-2">
    <label class="block text-sm text-gray-600 mb-1">Data de vencimento original</label>
    <input type="date" name="due_date"
           class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
  </div>
</div>
